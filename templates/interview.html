<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Question {{ current_number }} | Interview Lab</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark site-nav"><div class="container"><a class="navbar-brand brand-mark" href="{{ url_for('index') }}">INTERVIEW<span>LAB</span></a><span class="progress-label">QUESTION {{ '%02d'|format(current_number) }} / {{ '%02d'|format(total_questions) }}</span></div></nav><main class="interview-main"><div class="container narrow-container"><div class="question-progress"><span style="width: {{ (current_number / total_questions * 100)|round }}%"></span></div><div class="question-meta"><span>{{ question.category|upper }}</span><span>{{ question.difficulty|capitalize }}</span></div><h1 class="question-title">{{ question.question }}</h1><form method="post" action="{{ url_for('submit_answer') }}"><input type="hidden" name="question_id" value="{{ question.id }}"><label for="answer" class="visually-hidden">Your answer</label><textarea id="answer" name="answer" class="answer-box" rows="9" placeholder="Take a moment, then answer as if you were in the room..." required autofocus></textarea><div class="d-flex justify-content-between align-items-center mt-4"><span class="answer-hint">Be clear. Be specific. Be yourself.</span><button class="btn btn-primary btn-lg" type="submit">Submit answer <span>→</span></button></div></form><form method="post" action="{{ url_for('end_interview') }}" class="mt-5"><button class="text-button" type="submit">End interview</button></form></div></main><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
